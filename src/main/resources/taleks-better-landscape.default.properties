# Fantasy Terrain. Copied to config/fantasy_terrain.properties on first launch.
# Delete a line to get its default back. Restart the game (or reopen the world) after editing.

# Comma-separated feature ids, applied in order. Empty = vanilla terrain.
features=sea_stacks

# --- sea_stacks: rock towers standing in shallow water near the coast ---
# Tower height above sea level, in blocks (1..200).
sea_stacks.height=28
# Noise cutoff 0..1. Higher = rarer towers.
sea_stacks.threshold=0.72
# Noise ramp above the cutoff 0.01..1. Higher = wider, gentler tower slopes.
sea_stacks.edge=0.08
# Noise frequency 0.0005..1. Lower = towers farther apart and wider.
sea_stacks.scale=0.012
# Towers grow only where the continentalness value lies in [coast_min, coast_max].
# Vanilla: deep ocean < -0.455, shallow ocean to about -0.19, beach about -0.19..-0.11.
sea_stacks.coast_min=-0.30
sea_stacks.coast_max=-0.12
# Density added inside a tower (0.1..20). Raise if towers come out hollow or too thin.
sea_stacks.strength=3.0
# Blocks over which the tower top fades out (1..64). Higher = rounder tops.
sea_stacks.band=6
# Changes the tower layout.
sea_stacks.seed=1337
